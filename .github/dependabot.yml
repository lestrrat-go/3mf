version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    groups:
      # Group minor/patch bumps into one PR; majors stay separate so breaking
      # upgrades get individual review.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Pinned action SHAs in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
